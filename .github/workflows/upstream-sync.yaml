name: upstream-sync

# 自动同步上游，并用 Tools/sync-upstream.js 重新注入本 fork 的特性。
#
# 设计要点：
#  1. 全程在临时分支上操作，未通过全部校验前不碰 main —— 失败即丢弃分支，天然回滚。
#  2. 两个脚本被视为「上游原版 + 特性清单」的派生产物。冲突时不做人工式合并，
#     而是取上游侧后重新注入（L1 重建）；重建结果由 replay 逐字节校验。
#  3. 任一环节失败都开 issue 告警，并让 job 失败（GitHub 也会发邮件）。
#
# 注意：分发走 raw.githubusercontent.com/.../main/...，推送 main 等于立刻发布给所有客户端，
# 因此校验顺序不可省。需要观察期时用 workflow_dispatch 勾选 dry_run。

on:
  schedule:
    # 每天 20:00 UTC = 次日 04:00 (UTC+8)
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: '上游引用'
        required: false
        default: 'upstream/main'
      dry_run:
        description: '只验证不推送（观察模式）'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://github.com/AIsouler/MyClash.git
  UPSTREAM_REF: ${{ inputs.ref || 'upstream/main' }}
  DRY_RUN: ${{ inputs.dry_run || false }}

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: 配置上游并检查是否有更新
        id: gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream "$UPSTREAM_REPO" 2>/dev/null || git remote set-url upstream "$UPSTREAM_REPO"
          git fetch upstream --prune --tags

          if ! git rev-parse --verify --quiet "${UPSTREAM_REF}^{commit}" >/dev/null; then
            echo "::error::无法解析引用 ${UPSTREAM_REF}，请确认它存在于上游仓库（或写成 upstream/main）"
            exit 1
          fi

          AHEAD=$(git rev-list --count HEAD.."$UPSTREAM_REF")
          echo "上游领先 $AHEAD 个提交"
          if [ "$AHEAD" -eq 0 ]; then
            echo "has_update=0" >> "$GITHUB_OUTPUT"
          else
            echo "has_update=1" >> "$GITHUB_OUTPUT"
            git log --oneline "HEAD..$UPSTREAM_REF" | sed 's/^/  /'
          fi

      - name: 预检 · main 是否与「上游 + 清单」一致
        if: steps.gate.outputs.has_update == '1'
        run: |
          # 用上次已合并的上游提交做基准。返回非 0 说明 main 存在未写进清单的改动，
          # 此时禁止走 L1 重建路径（否则会丢代码），但 L0 直合仍然可以尝试。
          BASE=$(git merge-base HEAD "$UPSTREAM_REF")
          echo "基准提交：$BASE"
          if node Tools/sync-upstream.js replay --ref "$BASE"; then
            echo "replay_ok=1" >> "$GITHUB_ENV"
          else
            echo "replay_ok=0" >> "$GITHUB_ENV"
            echo "::warning::main 存在未声明的漂移，本次禁用 L1 重建路径"
          fi

      - name: 创建同步分支并合并
        id: merge
        if: steps.gate.outputs.has_update == '1'
        run: |
          BRANCH="sync/upstream-$(date -u +%Y%m%d-%H%M)"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          git checkout -b "$BRANCH"

          if git merge "$UPSTREAM_REF" --no-edit; then
            echo "result=clean" >> "$GITHUB_OUTPUT"
            echo "合并无冲突"
          else
            echo "result=conflict" >> "$GITHUB_OUTPUT"
            echo "冲突文件："
            git diff --name-only --diff-filter=U | sed 's/^/  /'
          fi

      - name: L1 重建 · 冲突落在注入目标内则取上游侧后重新注入
        if: steps.merge.outputs.result == 'conflict'
        run: |
          CONFLICTS=$(git diff --name-only --diff-filter=U)
          # 只允许在两个注入目标脚本上自动重建；其余文件的冲突一律人工处理
          for f in $CONFLICTS; do
            case "$f" in
              Script/mihomoScript.js | Script/Script.js) ;;
              *)
                echo "::error file=$f::冲突包含非注入目标文件，需人工处理"
                git merge --abort
                exit 1
                ;;
            esac
          done

          if [ "${replay_ok:-0}" != "1" ]; then
            echo "::error::main 存在未声明漂移，禁止重建（会丢代码），请人工解冲突"
            git merge --abort
            exit 1
          fi

          echo "冲突全部位于注入目标，改用「上游侧 + 重新注入」重建"
          git merge --abort
          git merge "$UPSTREAM_REF" -X theirs --no-edit
          node Tools/sync-upstream.js apply

      - name: 注入特性（直合路径）
        if: steps.merge.outputs.result == 'clean'
        run: node Tools/sync-upstream.js apply

      - name: 校验 · 特性完整性
        if: steps.gate.outputs.has_update == '1'
        run: node Tools/sync-upstream.js verify

      - name: 校验 · 注入幂等
        if: steps.gate.outputs.has_update == '1'
        run: |
          OUT=$(node Tools/sync-upstream.js apply)
          echo "$OUT"
          if ! echo "$OUT" | grep -q "注入 0 处"; then
            echo "::error::二次注入产生了改动，说明存在 marker 失效的补丁"
            exit 1
          fi

      - name: 校验 · 回放（脚本 == 上游 + 清单）
        if: steps.gate.outputs.has_update == '1'
        run: node Tools/sync-upstream.js replay --ref "$UPSTREAM_REF"

      - name: 校验 · 测试套件
        if: steps.gate.outputs.has_update == '1'
        run: |
          npm --prefix Test install
          node Test/run-tests.js

      - name: 缓存 mihomo 内核
        if: steps.gate.outputs.has_update == '1'
        uses: actions/cache@v4
        with:
          path: ~/mihomo-bin
          key: mihomo-1.19.33-linux-amd64-compatible

      - name: 准备 mihomo 内核
        id: kernel
        if: steps.gate.outputs.has_update == '1'
        run: |
          VER=1.19.33
          DIR="$HOME/mihomo-bin"
          BIN="$DIR/mihomo"
          mkdir -p "$DIR"
          if [ ! -x "$BIN" ]; then
            URL="https://github.com/MetaCubeX/mihomo/releases/download/v${VER}/mihomo-linux-amd64-compatible-v${VER}.gz"
            echo "下载内核：$URL"
            curl -fsSL --retry 3 --retry-delay 2 -o "$DIR/mihomo.gz" "$URL" \
              || { echo "::error::mihomo 内核下载失败，无法做配置校验"; exit 1; }
            gunzip -f "$DIR/mihomo.gz"
            chmod +x "$BIN"
          fi
          "$BIN" -v | head -1
          echo "bin=$BIN" >> "$GITHUB_OUTPUT"

      - name: 校验 · 配置产物可被内核加载（mihomo -t）
        if: steps.gate.outputs.has_update == '1'
        run: |
          BIN="${{ steps.kernel.outputs.bin }}"

          # 生成产物：全量版开 VG（覆盖「VG 开但订阅无家宽节点」这条空组路径），精简版默认。
          # 产出 JSON 即可——JSON 是 YAML 子集，mihomo 能直接解析，无需 YAML 依赖。
          node Tools/gen-config.js Script/mihomoScript.js "$RUNNER_TEMP/full.json" '{"VG":true}'
          node Tools/gen-config.js Script/Script.js "$RUNNER_TEMP/lite.json"

          fail=0
          check() {
            local name="$1" src="$2"
            mkdir -p "$RUNNER_TEMP/c_$name"
            cp "$src" "$RUNNER_TEMP/c_$name/config.yaml"
            echo "=== $name ==="
            if "$BIN" -d "$RUNNER_TEMP/c_$name" -f "$RUNNER_TEMP/c_$name/config.yaml" -t; then
              echo "✔ $name 通过"
            else
              echo "::error::$name 未通过 mihomo 校验（测试全绿但配置非法）"
              fail=1
            fi
          }

          check full "$RUNNER_TEMP/full.json"
          check lite "$RUNNER_TEMP/lite.json"
          check static-full Config/mihomoConfig.yaml
          check static-lite Config/mihomoConfigLite.yaml

          exit $fail

      - name: 提交并推送 main
        if: steps.gate.outputs.has_update == '1'
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "无待提交改动"
          else
            git commit -m "chore: 同步上游并重放 fork 特性"
          fi

          git checkout main
          git merge --no-ff "${{ steps.merge.outputs.branch }}" -m "Merge ${{ steps.merge.outputs.branch }}: 同步上游并重放 fork 特性（verify+幂等+replay+测试全绿）"

          if [ "${DRY_RUN}" = "true" ]; then
            echo "::notice::dry_run 已开启，跳过推送。待推送内容："
            git log --oneline origin/main..main
            exit 0
          fi

          # 校验期间可能有其他 workflow（如 format_and_test 的自动格式化）或人工提交
          # 推进了 main，此时直接 push 会因非快进失败——但那不是本次同步的问题。
          # 对齐远程后必须重跑关键校验，否则推的是「没验过的组合」。
          for attempt in 1 2 3; do
            if git push origin main; then
              echo "::notice::推送成功（第 $attempt 次尝试）"
              exit 0
            fi
            echo "::warning::第 $attempt 次推送失败，与远程对齐后重跑校验"
            git fetch origin main
            if ! git merge origin/main --no-edit; then
              echo "::error::与远程 main 合并冲突，需人工处理（本次未推送）"
              exit 1
            fi
            node Tools/sync-upstream.js verify
            node Tools/sync-upstream.js replay --ref "$UPSTREAM_REF"
            node Test/run-tests.js
          done
          echo "::error::连续 3 次推送均失败，请检查分支保护或仓库权限"
          exit 1

      - name: 失败告警
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # 必须显式 --repo：本流程会新增名为 upstream 的远程，gh 会按远程猜仓库，
          # 不指定就会把 issue 建到上游仓库（无权限）。
          gh label create upstream-sync-failed --repo "$GITHUB_REPOSITORY" --color B60205 --description "自动同步上游失败" 2>/dev/null || true

          BODY=$(cat <<EOF
          自动同步上游失败，main 未被修改（全程在临时分支操作，已丢弃）。

          - 运行记录：$RUN_URL
          - 上游：\`${{ env.UPSTREAM_REF }}\`
          - 触发：${{ github.event_name }}

          ## 排查顺序

          1. 看运行记录里第一个红色的 step。
          2. 若是 **锚点未找到 / 锚点不唯一**：上游改动了补丁锚点所指的代码。
             报错会打印锚点首行，去上游对应位置取新原文，更新 \`Tools/lib/feature-manifest.js\`。
          3. 若是 **特性校验失败**：上游删掉了某段被依赖的代码（声明丢失）。
             用 \`git log -S'符号名' --oneline ${{ env.UPSTREAM_REF }}\` 确认，再补回。
          4. 若是 **测试失败**：多为上游行为变更与本地特性冲突，本地复现后用
             \`node Tools/sync-upstream.js apply\` 重放。

          ## 回滚

          本次同步未推送，main 无需回滚。若需回退已合并的历史同步：

          \`\`\`bash
          git revert -m 1 <merge-sha>   # 撤销某次同步合并
          git push origin main
          \`\`\`

          已知良好版本见 tag：\`git tag -l 'v*'\`。
          EOF
          )

          TITLE="upstream-sync 失败：$(date -u +%Y-%m-%d)"

          # fork 仓库的 Issues 默认是关闭的，此时 gh issue 必然失败并打一条无意义的
          # 警告。先探测功能是否启用再决定，Telegram 与运行失败邮件不受影响。
          if [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.has_issues' 2>/dev/null || echo false)" = "true" ]; then
            EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --label upstream-sync-failed --state open --json number --jq '.[0].number' 2>/dev/null || true)
            if [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY" || echo "⚠️ 追加评论失败，请直接看运行记录"
            else
              # label 可能因权限创建失败，退化为不带 label 建 issue，避免告警本身把原始错误盖掉
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY" --label upstream-sync-failed \
                || gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY" \
                || echo "⚠️ 创建 issue 失败，请直接看运行记录"
            fi
          else
            echo "::notice::仓库未启用 Issues，跳过 issue 告警（Telegram 与运行失败邮件仍会送达）"
          fi

          # Telegram 推送：未配置 secret 时静默跳过；推送失败也只 warning，
          # 不能让告警通道本身把原始错误盖掉。
          if [ -n "${TELEGRAM_BOT_TOKEN}" ] && [ -n "${TELEGRAM_CHAT_ID}" ]; then
            # 用 printf 而非多行字面量：YAML 块标量的缩进会被原样带进消息
            TEXT=$(printf '⚠️ MyClash 上游自动同步失败\n上游引用：%s\n触发方式：%s\nmain 未被修改（全程在临时分支操作，已丢弃）。\n\n运行记录：%s' \
              "$UPSTREAM_REF" "${{ github.event_name }}" "$RUN_URL")
            if curl -fsS --retry 2 --retry-delay 2 -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${TEXT}" \
              -o /dev/null; then
              echo "Telegram 已通知"
            else
              echo "::warning::Telegram 推送失败，请查看 issue 或运行记录"
            fi
          else
            echo "未配置 TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID，跳过 Telegram 通知"
          fi

      - name: 结果摘要
        if: always()
        run: |
          {
            echo "### upstream-sync"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 上游引用 | \`${UPSTREAM_REF}\` |"
            echo "| 有新提交 | ${HAS_UPDATE:-unknown} |"
            echo "| 合并结果 | ${MERGE_RESULT:-未执行} |"
            echo "| 观察模式 | ${DRY_RUN} |"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          HAS_UPDATE: ${{ steps.gate.outputs.has_update }}
          MERGE_RESULT: ${{ steps.merge.outputs.result }}
